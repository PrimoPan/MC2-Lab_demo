# Keep the legacy domain and TLS certificate for redirects.
server {
    listen 80;
    listen [::]:80;
    server_name mc2-lab.space www.mc2-lab.space;
    return 301 https://mc2.hkust-gz.edu.cn$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mc2-lab.space www.mc2-lab.space;
    ssl_certificate /etc/letsencrypt/live/mc2-lab.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc2-lab.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mc2.hkust-gz.edu.cn$request_uri;
}
