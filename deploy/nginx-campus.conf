# Only the established public HTTPS hostname opts in to HSTS. The one-day
# initial policy excludes subdomains/preload and does not affect IP access.
map $host $mc2_hsts {
    default "";
    mc2.hkust-gz.edu.cn "max-age=86400";
}

server {
    listen 2026 default_server;
    listen [::]:2026 default_server;
    server_name _;

    root /srv/mc2-lab/current/site;
    index index.html;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/mc2-security-headers.conf;

    access_log /var/log/nginx/mc2-lab-access.log;
    error_log /var/log/nginx/mc2-lab-error.log;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:2027;
        proxy_set_header Host $host;
        # Replace caller-controlled proxy headers. The application checks Origin
        # against its configured HTTPS site and always issues Secure cookies.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /media/people/ {
        alias /var/lib/mc2-admin/photos/;
        autoindex off;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin {
        try_files /index.html =404;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        try_files $uri =404;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/mc2-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
