# Repeat this include in locations with add_header: Nginx 1.24 does not merge
# location headers with server headers. "always" also protects error responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Strict-Transport-Security $mc2_hsts always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# The obsolete browser XSS filter can introduce vulnerabilities. CSP below
# supplies the active script policy instead.
add_header X-XSS-Protection "0" always;
# Scripts are local Vite bundles. Existing React styles need inline CSS;
# external CSS/fonts and workshop logos are limited to their current origins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://unpkg.com https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://1000logos.net https://criticaldatathon.github.io; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
# The campus gateway passes these headers through its verified HTTPS endpoint.
# credentialless permits public CDN images/styles without cross-site cookies.
# Clear-Site-Data belongs only on successful API logout, never every response.
