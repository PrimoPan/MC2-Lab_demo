name: Publish campus website release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mc2-campus-release
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'PrimoPan/MC2-Lab_demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: python -m unittest discover -s deploy/tests -v
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_PEOPLE_API_ENABLED: 'true'
      - run: python tools/package-campus.py
      - name: Publish successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="campus-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" campus.tar.gz campus.sha256 --target "$GITHUB_SHA" --latest --title "Campus website ${GITHUB_SHA:0:12}" --notes 'Campus frontend and matching source. Persistent data and accounts are excluded.'
